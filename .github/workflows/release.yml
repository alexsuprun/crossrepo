name: Release

on:
  push:
    branches: [master]

permissions:
  contents: read

# Never cancel: a cancelled run could stop between the npm publish and the tag.
concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

# The npm Trusted Publisher is bound to this file name (release.yml) and to the
# "npm" environment on the release job. Renaming either breaks publishing.
jobs:
  # CI runs on the same push, so check master here before anything ships.
  # This job has no id-token, so test and dev-tool code cannot mint the npm token.
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          no-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
          check-latest: true
      - run: bun install --frozen-lockfile
      - run: bun run validate

  release:
    name: release
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: write
      id-token: write
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          no-cache: true
      # No registry-url: it writes an .npmrc that expects a token, and
      # publishing uses OIDC (Trusted Publishing) instead.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
          check-latest: true
      # Trusted Publishing needs npm 11.5.1 or newer.
      - name: Ensure npm 11.5.1 or newer
        run: |
          need="11.5.1"
          is_new_enough() {
            [ "$(printf '%s\n' "$need" "$1" | sort -V | head -n1)" = "$need" ]
          }
          have="$(npm --version)"
          echo "npm $have, need $need"
          if ! is_new_enough "$have"; then
            npm i -g npm@^11.5.1
            have="$(npm --version)"
            echo "npm upgraded to $have"
          fi
          if ! is_new_enough "$have"; then
            echo "npm $have is older than $need"
            exit 1
          fi
      - run: bun install --frozen-lockfile
      # A PR opened with GITHUB_TOKEN starts no workflows, so the version PR
      # uses an App token to get its required checks.
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          publish-script: bun run release
          version: bun run version-packages
          pr-title: "chore: version packages"
          commit-message: "chore: version packages"
        env:
          NPM_CONFIG_PROVENANCE: "true"
      - id: version
        if: steps.changesets.outputs.published == 'true'
        env:
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.published-packages }}
        run: |
          version="$(jq -r '.[] | select(.name == "crossrepo") | .version' <<< "$PUBLISHED_PACKAGES")"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  smoke:
    name: smoke
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      # The checkout gives setup-bun the pinned Bun from packageManager.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          no-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.13"
          package-manager-cache: false
          check-latest: true
      - name: Wait until npm serves the version
        run: |
          for _ in $(seq 1 30); do
            if [ "$(npm view "crossrepo@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
              echo "crossrepo@$VERSION is on npm"
              exit 0
            fi
            sleep 10
          done
          echo "crossrepo@$VERSION is not on npm after 5 minutes"
          exit 1
      # Run from an empty folder so nothing resolves to the checked-out package.
      - name: npm i -g under Node 22.13
        working-directory: ${{ runner.temp }}
        run: |
          node --version
          npm i -g "crossrepo@$VERSION"
          bin_dir="$(npm prefix -g)/bin"
          for cmd in crossrepo xr; do
            out="$("$bin_dir/$cmd" --version)"
            echo "$cmd --version: $out"
            test "$out" = "$VERSION"
          done
      # Bun's global bins link to the node-shebang file, so Node stays on PATH.
      - name: bun add -g
        working-directory: ${{ runner.temp }}
        run: |
          bun --version
          bun add -g "crossrepo@$VERSION"
          bin_dir="$(bun pm bin -g)"
          for cmd in crossrepo xr; do
            out="$("$bin_dir/$cmd" --version)"
            echo "$cmd --version: $out"
            test "$out" = "$VERSION"
          done
      - name: Remove Node from PATH
        id: no-node
        run: |
          bun_dir="$(dirname "$(command -v bun)")"
          echo "path=$bun_dir:/usr/bin:/bin:/usr/sbin:/sbin" >> "$GITHUB_OUTPUT"
      - name: bunx with only Bun
        working-directory: ${{ runner.temp }}
        run: |
          export PATH="${{ steps.no-node.outputs.path }}"
          if command -v node; then
            echo "node is still on PATH"
            exit 1
          fi
          out="$(bunx "crossrepo@$VERSION" --version)"
          echo "bunx crossrepo --version: $out"
          test "$out" = "$VERSION"
