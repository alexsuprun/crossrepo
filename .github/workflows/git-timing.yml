name: Git timing (temporary)

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  timing:
    name: git timing (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - name: Turn off Defender real-time scanning
        if: runner.os == 'Windows'
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          no-cache: true
      - run: bun install --frozen-lockfile
        shell: bash
      - name: Which git (bash)
        shell: bash
        run: |
          echo "PATH=$PATH"
          which -a git
      - name: Which git (pwsh)
        shell: pwsh
        run: |
          $env:PATH
          Get-Command git -All | Format-Table -AutoSize Source
      - name: Timing (bash)
        shell: bash
        run: bun scripts/git-timing.ts
      - name: Timing (pwsh)
        shell: pwsh
        run: bun scripts/git-timing.ts
      - name: One test file (bash)
        shell: bash
        run: |
          start=$(date +%s)
          bun test tests/commands/codebase/clone.test.ts --timeout 120000
          echo "clone.test.ts under bash: $(( $(date +%s) - start )) s"
      - name: One test file (pwsh)
        shell: pwsh
        run: |
          $t = Measure-Command { bun test tests/commands/codebase/clone.test.ts --timeout 120000 | Out-Default }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "clone.test.ts under pwsh: $([int]$t.TotalSeconds) s"
