name: Git timing (temporary)

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workers:
    name: test workers (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - name: Turn off Defender real-time scanning
        if: runner.os == 'Windows'
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          no-cache: true
      - run: bun install --frozen-lockfile
        shell: bash
      # The full suite once per worker count; "default" is plain --parallel, one worker per core.
      - name: Full suite with 3 worker counts
        shell: bash
        run: |
          for workers in default 8 12; do
            flag=--parallel
            [ "$workers" = default ] || flag="--parallel=$workers"
            start=$(date +%s)
            code=0
            bun test "$flag" --timeout 30000 > "out-$workers.log" 2>&1 || code=$?
            took=$(( $(date +%s) - start ))
            line="workers=$workers ($(grep -o '[0-9]*x PARALLEL' "out-$workers.log")) exit=$code wall=${took}s"
            line="$line $(grep -E '^ *[0-9]+ (pass|fail)$' "out-$workers.log" | tr -s ' \n' ' ')"
            line="$line timeouts=$(grep -c 'timed out after' "out-$workers.log" || true)"
            echo "$line"
            echo "- $line" >> "$GITHUB_STEP_SUMMARY"
            grep -E '^\(fail\)' "out-$workers.log" || true
          done
